x-healthcheck: &healthcheck
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 15s

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

services:
  redis:
    image: redis:7-alpine
    container_name: trademetrix_redis
    restart: unless-stopped
    networks:
      - trademetrix
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis-data:/data
      - ../redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--protected-mode", "no"]
    logging: *default-logging

  api:
    build:
      context: ../../apps/api
      dockerfile: Dockerfile
    container_name: trademetrix_api
    restart: unless-stopped
    networks:
      - trademetrix
    env_file: ../../apps/api/.env
    environment:
      ENV: production
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: https://ai.trademetrix.tech
      COOKIE_DOMAIN: .trademetrix.tech
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 768m
    cpus: 2.0
    ports:
      - "127.0.0.1:8000:8000"
    security_opt:
      - no-new-privileges:true
    logging: *default-logging

  web:
    build:
      context: ../../apps/web
      dockerfile: Dockerfile
    container_name: trademetrix_web
    restart: unless-stopped
    networks:
      - trademetrix
    env_file: ../../apps/web/.env
    environment:
      NEXT_PUBLIC_API_URL: https://api.ai.trademetrix.tech/api/v1
      NEXT_PUBLIC_WS_URL: wss://api.ai.trademetrix.tech/api/v1/marketdata/ws
      HOSTNAME: 0.0.0.0
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    mem_limit: 512m
    cpus: 0.5
    logging: *default-logging

  grafana:
    image: grafana/grafana:latest
    container_name: trademetrix_grafana
    restart: unless-stopped
    networks:
      - trademetrix
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: https://monitor.ai.trademetrix.tech
      GF_INSTALL_PLUGINS: "grafana-piechart-panel"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ../grafana/datasources:/etc/grafana/provisioning/datasources:ro
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging
    depends_on:
      - prometheus

  n8n:
    image: n8nio/n8n:latest
    container_name: trademetrix-n8n
    restart: unless-stopped
    networks:
      - trademetrix
    environment:
      NODE_OPTIONS: "--max-old-space-size=1024"
      N8N_HOST: n8n.trademetrix.tech
      N8N_PORT: 5678
      N8N_PROTOCOL: https
      N8N_WEBHOOK_URL: https://n8n.trademetrix.tech
      N8N_EDITOR_BASE_URL: https://n8n.trademetrix.tech
      EXECUTIONS_DATA_PRUNE: "true"
      EXECUTIONS_DATA_MAX_AGE: 168
    volumes:
      - n8n-data:/home/node/.n8n
    mem_limit: 1g
    cpus: 1.0
    logging: *default-logging

  market-agent:
    build:
      context: ../../apps/market-agent
      dockerfile: Dockerfile
    container_name: trademetrix_market_agent
    restart: unless-stopped
    networks:
      - trademetrix
    env_file: ../../apps/api/.env
    environment:
      REDIS_URL: redis://redis:6379/0
      SYMBOLS: "NSE:NIFTY50-INDEX,BSE:SENSEX-INDEX"
      LOG_LEVEL: INFO
    depends_on:
      redis:
        condition: service_healthy
    mem_limit: 256m
    cpus: 0.5
    logging: *default-logging

  autoheal:
    image: willfarrell/autoheal:latest
    container_name: trademetrix_autoheal
    restart: unless-stopped
    networks: []
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      AUTOHEAL_CONTAINER_LABEL: autoheal
      AUTOHEAL_INTERVAL: 30
      AUTOHEAL_START_PERIOD: 60
    mem_limit: 32m
    cpus: 0.1
    logging: *default-logging

  node-exporter:
    image: prom/node-exporter:latest
    container_name: trademetrix_node_exporter
    restart: unless-stopped
    networks:
      - trademetrix
    ports:
      - "127.0.0.1:9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    mem_limit: 128m
    cpus: 0.2
    logging: *default-logging

networks:
  trademetrix:
    driver: bridge
    enable_ipv6: true
    ipam:
      config:
        - subnet: "fd00:dead:beef::/48"

volumes:
  redis-data:
  caddy-data:
  caddy-config:
  prometheus-data:
  grafana-data:
  n8n-data:
