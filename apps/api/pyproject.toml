[project]
name = "trademetrix-api"
version = "0.1.0"
description = "Trade Metrix Trading Terminal — FastAPI Backend"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.0,<3",
    "pydantic-settings>=2.0",
    "httpx>=0.27.0",
    "websockets>=12.0",
    "supabase>=2.0",
    "cryptography>=42.0",
    "argon2-cffi>=23.0",
    "python-jose[cryptography]>=3.3",
    "passlib[argon2]>=1.7",
    "python-multipart>=0.0.9",
    "google-genai>=1.0",
    "apscheduler>=3.10",
    "pandas>=2.0",
    "numpy>=1.26",
    "ta-lib>=0.5",
    "python-dotenv>=1.0",
    "redis>=5.0",
    "alembic>=1.13",
    "fyers-apiv3>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.3",
    "mypy>=1.8",
]

# NOTE: ruff configuration lives in `ruff.toml`, next to this file — NOT here.
#
# A `[tool.ruff]` section sat in this file and was never read: `ruff.toml` takes precedence,
# and `ruff check --show-settings` reports the resolved path. So the two disagreed (`select`
# listed `I`, the effective config ignored `I001`; `line-length` was 100 here and 120
# there), and editing the section below looked like it worked while changing nothing. That
# is a plausible reason nobody ever fixed the permanently-failing `Lint API` job.
#
# The empty tables are left in place as a signpost rather than removed, so the history is
# visible if someone goes looking for a `[tool.ruff]` that is not doing anything.

[tool.ruff]

[tool.ruff.lint]

[tool.mypy]
python_version = "3.12"
strict = false
disallow_untyped_defs = true
ignore_missing_imports = true
